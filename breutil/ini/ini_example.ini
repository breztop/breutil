; 这是一个完整的 INI 配置文件示例
; 支持使用 ; 或 # 作为注释符

# 数据库配置
[Database]
Host=localhost
Port=3306
Username=admin
Password="my_secure_password"  # 使用引号包含特殊字符
Database=mydb
MaxConnections=100  ; 最大连接数
Timeout=30.5
EnableSSL=true
AutoReconnect=yes

# 服务器配置
[Server]
ListenAddress=0.0.0.0
ListenPort=5432
MaxThreads=16
Debug=false  ; 禁用调试模式
LogLevel='INFO'  # 单引号也可以
RootPath="/var/www/html"

# 应用配置
[Application]
Name="My Application"
Version=1.2.3
Author='John Doe'
Description="A comprehensive\napplication with\tmultiple features"  # 支持转义字符
EnableFeatureX=on
EnableFeatureY=off

# 日志配置
[Logging]
LogDir="/var/log/myapp"
MaxFileSize=10485760  # 10MB in bytes
MaxBackups=5
CompressOldLogs=true
LogToConsole=1
LogToFile=1

# 缓存配置
[Cache]
Enabled=yes
Type=redis
Host=127.0.0.1
Port=6379
TTL=3600
MaxMemory=512

# 邮件配置
[Email]
SMTPHost=smtp.example.com
SMTPPort=587
UseTLS=true
Username=noreply@example.com
Password="email_password"
FromAddress="My App <noreply@example.com>"

# 路径配置 (演示Windows路径)
[Paths]
DataDir="C:\\ProgramData\\MyApp"
ConfigDir="C:\\Users\\Public\\MyApp\\Config"
TempDir=/tmp/myapp

; 空值和默认值测试
[Defaults]
EmptyValue=
NullValue=""
SpacesValue="   "
ZeroInt=0
ZeroFloat=0.0
FalseValue=false
